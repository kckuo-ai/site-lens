name: sitegen probe (temporary)
on:
  push:
    branches: [claude/sitegen]
    paths: [.github/workflows/sitegen-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q overturemaps "laspy[lazrs]" pyproj shapely
      - name: EPT boundaries
        run: |
          for u in https://raw.githubusercontent.com/hobuinc/usgs-lidar/master/boundaries/resources.geojson \
                   https://usgs-lidar-public.s3.amazonaws.com/boundaries/resources.geojson \
                   https://s3-us-west-2.amazonaws.com/usgs-lidar-public/boundaries/resources.geojson; do
            echo "== $u"; curl -sSL -o /tmp/b.json -w '%{http_code} %{size_download}\n' "$u" || true
            head -c 600 /tmp/b.json; echo
          done
          curl -sS https://s3-us-west-2.amazonaws.com/usgs-lidar-public/WA_KingCounty_2021_B21/ept.json | head -c 1500; echo
          curl -sS -o /dev/null -w 'hier %{http_code}\n' https://s3-us-west-2.amazonaws.com/usgs-lidar-public/WA_KingCounty_2021_B21/ept-hierarchy/0-0-0-0.json
          python - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/b.json'))
              fs = d['features']; print('features', len(fs)); print(fs[0]['properties'])
              ak = [f['properties'] for f in fs if 'AK' in f['properties'].get('name', '')[:3]]
              print('AK resources', len(ak), [a['name'] for a in ak][:40])
          except Exception as e:
              print('parse fail', e)
          PY
      - name: Overture
        run: |
          python - <<'PY'
          import time
          from overturemaps import core
          import pyarrow.compute as pc
          t = time.time()
          bbox = (-122.338, 47.606, -122.332, 47.610)
          tbl = core.record_batch_reader("building", bbox).read_all()
          print("rows", tbl.num_rows, "s", round(time.time() - t, 1))
          print("cols", tbl.column_names)
          print("with height", tbl.num_rows - pc.sum(pc.is_null(tbl["height"])).as_py())
          row = tbl.slice(0, 1).to_pylist()[0]
          print({k: (str(v)[:120]) for k, v in row.items()})
          PY
