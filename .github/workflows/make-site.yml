name: Make site (產生站點資訊)

# Dispatched by the web page ("產生站點資訊"). The run name carries only the random request id.
# Coordinates and the public key are read from the event payload by the script itself: they are never
# put in env vars (Actions prints step env in the log) or echoed. The result is encrypted for the
# requesting browser and stored on the sitegen-out branch, which always holds a single commit.
run-name: make-site ${{ inputs.req }}

on:
  workflow_dispatch:
    inputs:
      req:
        description: request id (generated by the page)
        required: true
      lat:
        description: centre latitude
        required: true
      lon:
        description: centre longitude
        required: true
      radius:
        description: radius in metres (100-1500)
        required: false
        default: '500'
      pubkey:
        description: base64 SPKI RSA-OAEP public key of the requesting browser
        required: true

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Mask inputs
        run: |
          for k in lat lon radius; do
            v=$(jq -r ".inputs.$k // empty" "$GITHUB_EVENT_PATH")
            [ -n "$v" ] && echo "::add-mask::$v"
          done
          jq -re '.inputs.req | test("^r[0-9a-z]{8,24}$")' "$GITHUB_EVENT_PATH" > /dev/null || { echo "bad request id"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-sitegen.txt
      - name: Install
        run: pip install -q -r scripts/requirements-sitegen.txt
      - name: Generate (buildings, lidar heights, canopy)
        run: python scripts/make_site.py --from-event "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/result.json"
      - name: Publish encrypted result to sitegen-out
        env:
          OUT_BRANCH: sitegen-out
        run: |
          set -euo pipefail
          REQ=$(jq -r .inputs.req "$GITHUB_EVENT_PATH")
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            TREE_DIR="$RUNNER_TEMP/out-tree"; rm -rf "$TREE_DIR"; mkdir -p "$TREE_DIR"
            BASE=""
            if git fetch -q --depth=1 origin "$OUT_BRANCH" 2>/dev/null; then
              BASE=$(git rev-parse FETCH_HEAD)
              git archive "$BASE" | tar -x -C "$TREE_DIR"
            fi
            python scripts/sitegen_publish.py "$TREE_DIR" "$RUNNER_TEMP/result.json" "$REQ"
            export GIT_INDEX_FILE="$RUNNER_TEMP/out-index"; rm -f "$GIT_INDEX_FILE"
            git --work-tree="$TREE_DIR" add -A
            TREE=$(git write-tree); unset GIT_INDEX_FILE
            COMMIT=$(git commit-tree "$TREE" -m "sitegen result $REQ")
            # single-commit branch; the lease makes concurrent runs retry instead of overwriting each other
            if git push -q --force-with-lease="refs/heads/$OUT_BRANCH:$BASE" origin "$COMMIT:refs/heads/$OUT_BRANCH"; then
              echo "published"; exit 0
            fi
            echo "branch moved, retry $i"; sleep $((RANDOM % 8 + 2))
          done
          exit 1
